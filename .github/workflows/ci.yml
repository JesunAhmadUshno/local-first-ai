name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Unit, egress and layout tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Learn, Build, Deep and rigor runs; results regenerate from the code and corpus
        run: python src/check_results.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser port matches the recorded results
        run: node site/src/engine.check.mjs
